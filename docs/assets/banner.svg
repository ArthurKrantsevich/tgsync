<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">tgsync</title>
  <desc id="d">tgsync logo and tagline: Claude Code in your pocket, over Telegram</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1f3d"/>
      <stop offset="0.55" stop-color="#134a63"/>
      <stop offset="1" stop-color="#15707f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2a8a9a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2a8a9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294d"/>
      <stop offset="1" stop-color="#16697a"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#glow)"/>
    <!-- soft decorative rings -->
    <circle cx="1180" cy="-40" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
    <circle cx="1180" cy="-40" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
    <circle cx="1240" cy="430" r="160" fill="none" stroke="#ffc85a" stroke-opacity="0.10" stroke-width="2"/>
  </g>

  <!-- logo tile -->
  <g transform="translate(96 72)">
    <rect width="256" height="256" rx="56" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <g transform="translate(128 128) scale(0.44) translate(-329 -303)">
      <polyline points="175,222 280,318 175,414" fill="none" stroke="#f5f8fc" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="314" y="392" width="128" height="48" rx="24" fill="#f5f8fc"/>
      <path d="M448 166 L459 199 L492 210 L459 221 L448 254 L437 221 L404 210 L437 199 Z" fill="#ffc85a"/>
      <circle cx="497" cy="268" r="9" fill="#ffc85a"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="410" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="112" font-weight="800" fill="#ffffff" letter-spacing="-2">tgsync</text>
  <path d="M806 88 L814 112 L838 120 L814 128 L806 152 L798 128 L774 120 L798 112 Z" fill="#ffc85a"/>

  <!-- tagline -->
  <text x="414" y="248" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#e8f1f5">Claude Code in your pocket — <tspan fill="#ffc85a">over Telegram</tspan></text>

  <!-- chips -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8f1f5">
    <rect x="414" y="288" width="240" height="42" rx="21" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="534" y="316" text-anchor="middle">Runs on your machine</text>
    <rect x="668" y="288" width="214" height="42" rx="21" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="775" y="316" text-anchor="middle">Approve by button</text>
    <rect x="896" y="288" width="272" height="42" rx="21" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="1032" y="316" text-anchor="middle">Linux · macOS · Windows</text>
  </g>
</svg>
